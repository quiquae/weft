name: Site

# Builds and verifies the content site on every push, and deploys it only
# when told to. The 700-odd lexicon pages are generated rather than
# committed, so this workflow is the only thing that checks them.
#
# Deployment is opt-in via the repository variable WEFT_PAGES=true, for two
# reasons that both matter more than a green tick:
#
#   1. Publishing is not reversible in the way a commit is. Once the site is
#      live and indexed, taking it down leaves search results pointing at
#      nothing.
#   2. It should not go live until the links on it work. While the repository
#      is private, the install page's download button points at
#      `<repo>/releases/latest`, which 404s for everyone but the owner, and
#      the pricing page's checkout URLs point at a placeholder store.
#
# So the build and the link check run unconditionally — a broken site still
# fails the build — and the deploy waits for a decision. Enable Pages at
# Settings -> Pages (source: GitHub Actions), then set the variable:
#
#     gh variable set WEFT_PAGES --body true
#
# Without it the deploy job is skipped, not failed.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build-site.mjs'
      - 'tools/sitemap.ts'
      - 'tools/check-links.mjs'
      - 'tools/make-og.mjs'
      - 'tools/seed/**'
      - 'src/core/pricing.ts'
      - 'src/core/entitlements.ts'
      # Rendered into /privacy and /support. The privacy policy is a
      # published legal document; an edit to it that never reaches the site
      # is the one kind of staleness that matters to a store reviewer.
      - 'docs/PRIVACY.md'
      - 'docs/SUPPORT.md'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The sitemap dates each hand-written page by the commit that last
          # changed the document behind it. At the default depth of 1 every
          # file's last commit is HEAD, so every page would claim to have
          # changed on the day of the deploy — which is the bug this replaced.
          # tools/sitemap.ts detects a shallow clone and emits no <lastmod>
          # at all rather than a wrong one, so removing this line loses the
          # dates silently; it does not fail the build.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the lexicons the site is generated from
        run: npm run packs

      - name: Generate the site
        run: node tools/build-site.mjs
        env:
          # Canonical URLs and the sitemap are absolute, so this has to be
          # the real domain or search engines will index the wrong one.
          WEFT_SITE_URL: ${{ vars.WEFT_SITE_URL || 'https://weft.study' }}
          WEFT_REPO: ${{ github.server_url }}/${{ github.repository }}

      - name: Check every internal link resolves
        run: node tools/check-links.mjs

      # Since v4 this leaves hidden files out of the artifact, silently,
      # unless the step sets include-hidden-files: true, which v5 added. The
      # site builds none, so a .well-known/ or a .nojekyll would build,
      # link-check and never deploy: tests/tools/build-site.test.ts fails on
      # one while this step does not ask for them.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    # Skipped rather than failed when Pages has not been enabled. Before this
    # guard the job failed on every push with a 404 from deploy-pages, which
    # is a red X for a configuration decision nobody had made yet — and a red
    # X that is ignored is worse than no check at all.
    if: vars.WEFT_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
