name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every action is at a major that runs on Node 24, which GitHub's runners
# have run since they dropped Node 20 on 2026-09-23. One still on 20 runs
# forced onto 24 and ends its job on a warning naming it, as checkout@v4,
# setup-node@v4 and upload-artifact@v4 did here; release.yml keeps its v4s
# until B2 in TODO.md. tests/tools/workflow-actions.test.ts reads every
# uses: line and fails on one below its first Node 24 major.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # src/lexicon/packs/ is generated from tools/seed/*.tsv and committed,
      # because the extension loads the packs at runtime and the build does not
      # regenerate them. Rebuilding here catches a seed lexicon edited without
      # `npm run packs`, which would ship the old words while every other check
      # passed. Only possible because the builder is reproducible: it keeps the
      # previous `builtAt` when nothing else about a pack has changed.
      - name: Committed packs match the seed lexicons
        run: |
          npm run packs
          git diff --exit-code -- src/lexicon/packs
      - name: Verify lexicon packs
        run: npm run packs:verify
      - name: Unit tests
        run: npm run test:unit
      - name: DOM tests
        run: npm run test:dom
      # Covers the generators that produce shipped artefacts, in a temporary
      # directory rather than the tracked packs.
      - name: Tool tests
        run: npm run test:tools
      # Asks MDN's compatibility data whether every browser we claim to
      # support actually implements what we use. Fails on anything
      # unsupported that has no named fallback. Runs before the build
      # because it needs no browser and takes under a second.
      - name: Browser compatibility audit
        run: npm run compat
      - name: Build (chrome + firefox + safari)
        run: npm run build:all
      # Pre-flights the built packages against what the stores reject for:
      # unused permissions, a leaked test seam, unresolved __MSG_*__,
      # inline scripts, missing referenced files, remote code.
      - name: Validate packages
        run: npm run validate
      - name: Install Playwright browsers
        # The full Chromium, not the headless shell: the shell cannot load
        # extensions at all.
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weft-dist
          path: dist/
          retention-days: 7
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Everything check runs that needs no browser, on the lowest Node
  # package.json's engines.node admits. check's `22` takes the newest 22, so
  # a tool or a dependency reaching for an API newer than the floor would
  # pass there and fail for anyone on the floor itself. Each step is check's;
  # see there for why it runs. tests/tools/node-floor.test.ts derives the
  # floor from engines.node and fails if no job is on it, or if this one
  # skips a command check runs without a browser. Quoted, because YAML reads
  # an unquoted 22.20 as the number 22.2.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Committed packs match the seed lexicons
        run: |
          npm run packs
          git diff --exit-code -- src/lexicon/packs
      - name: Verify lexicon packs
        run: npm run packs:verify
      - name: Unit tests
        run: npm run test:unit
      - name: DOM tests
        run: npm run test:dom
      - name: Tool tests
        run: npm run test:tools
      - name: Browser compatibility audit
        run: npm run compat
      - name: Build (chrome + firefox + safari)
        run: npm run build:all
      - name: Validate packages
        run: npm run validate
