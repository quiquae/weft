name: Release

# Cutting a tag publishes the packages. Everything that can fail is checked
# before anything is attached, so a bad build never becomes a download.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and DOM tests
        run: npm test

      - name: Browser compatibility audit
        run: npm run compat

      - name: Build lexicons
        run: npm run packs

      - name: Check lexicons
        run: npm run packs:verify

      - name: Build icons
        run: node tools/make-icons.mjs

      - name: Install Chromium for the end-to-end suite
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Package all three browsers
        run: npm run zip

      # Last gate before anything is attached to a release. The zips are
      # built from dist/, so validating dist/ validates what ships.
      - name: Validate packages
        run: npm run validate

      - name: Build the content site
        run: node tools/build-site.mjs

      # The tag is v1.2.3; tools/release.mjs writes RELEASE-1.2.3.md. Without
      # stripping the v, the release action looks for RELEASE-v1.2.3.md,
      # fails to find it, and reports a generic error about the body file.
      # This turns the first release of any version into a puzzle, which is
      # exactly when nobody wants one.
      - name: Locate the release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          path="RELEASE-${version}.md"
          if [ ! -f "$path" ]; then
            echo "::error::Expected release notes at $path (tag ${GITHUB_REF_NAME})."
            echo "::error::Run: npm run release -- --version=${version}   then commit ${path}."
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Attach the packages to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            weft-chrome-*.zip
            weft-firefox-*.zip
            weft-safari-*.zip
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: true
        continue-on-error: false
